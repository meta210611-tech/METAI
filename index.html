<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>METAI v5.2 - Fixed Sidebar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        :root { --accent: #3b82f6; --bg-dark: #020617; --bg-panel: #0f172a; }

        body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg-dark); color: #f8fafc; font-family: 'Inter', sans-serif; }

        /* Device Simulator */
        .view-mobile { width: 375px !important; margin: 20px auto; border: 12px solid #1e293b; border-radius: 32px; height: calc(100% - 40px) !important; }
        .view-tablet { width: 768px !important; margin: 20px auto; border: 12px solid #1e293b; border-radius: 24px; height: calc(100% - 40px) !important; }
        .view-desktop { width: 100% !important; height: 100% !important; margin: 0; border: none; }

        /* THE FIX: Sidebar Z-Index and Background Force */
        #sidebar { 
            background-color: #0f172a !important; 
            width: 280px; 
            transition: transform 0.3s ease; 
            z-index: 100;
        }

        @media (max-width: 1024px) { 
            #sidebar { 
                position: fixed; 
                left: 0;
                transform: translateX(-100%);
                z-index: 9999 !important; /* Forces it to the absolute front */
                height: 100%; 
                box-shadow: 20px 0 50px rgba(0,0,0,0.5);
            } 
            #sidebar.active { transform: translateX(0); } 
        }

        #sidebar-overlay { z-index: 9998 !important; }

        .tab-active { background-color: #010409; color: #60a5fa; border-top: 2px solid #3b82f6; }
        .tab-inactive { background-color: transparent; color: #64748b; border-top: 2px solid transparent; }
        
        iframe { border: none; width: 100%; height: 100%; background: white; }
    </style>
</head>
<body>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/80 hidden" onclick="toggleSidebar()"></div>

    <div class="flex h-full w-full">
        <aside id="sidebar" class="border-r border-white/10 flex flex-col shrink-0">
            <div class="p-6 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold">M</div>
                    <span class="font-black text-xl italic uppercase">METAI <span class="text-[10px] text-blue-400">v5.2</span></span>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 p-2 text-xl"><i class="fas fa-times"></i></button>
            </div>

            <div class="flex-1 overflow-y-auto px-4">
                <div class="flex items-center justify-between mb-4 px-2">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Workspaces</span>
                    <button onclick="createNewProject()" class="text-blue-500 hover:text-white"><i class="fas fa-plus-circle"></i></button>
                </div>
                <div id="project-list" class="space-y-1"></div>
            </div>

            <div class="p-4 border-t border-white/5">
                <button onclick="toggleSettings()" class="w-full text-slate-400 flex items-center gap-3 p-2 text-sm">
                    <i class="fas fa-cog"></i> <span>Settings</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0">
            <header class="h-14 border-b border-white/5 bg-slate-900/50 flex items-center justify-between px-4">
                <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 p-2"><i class="fas fa-bars"></i></button>
                
                <div class="flex bg-white/5 rounded-lg p-1">
                    <button id="btn-preview" onclick="setView('preview')" class="px-4 py-1.5 rounded-md text-[10px] font-bold bg-blue-600 text-white">PREVIEW</button>
                    <button id="btn-code" onclick="setView('code')" class="px-4 py-1.5 rounded-md text-[10px] font-bold text-slate-400">CODE</button>
                </div>

                <button onclick="downloadCode()" class="text-blue-400 p-2"><i class="fas fa-download"></i></button>
            </header>

            <div class="flex-1 relative overflow-hidden">
                <div id="preview-container" class="w-full h-full flex items-center justify-center bg-slate-100">
                    <iframe id="preview-frame" class="view-desktop shadow-xl"></iframe>
                </div>
                
                <div id="code-container" class="hidden w-full h-full flex flex-col bg-[#010409]">
                    <div class="flex border-b border-white/5 bg-slate-900 px-2 pt-2">
                        <button onclick="switchFile('html')" id="tab-html" class="tab-active px-4 py-2 text-xs font-mono rounded-t-lg">html</button>
                        <button onclick="switchFile('css')" id="tab-css" class="tab-inactive px-4 py-2 text-xs font-mono rounded-t-lg">css</button>
                        <button onclick="switchFile('js')" id="tab-js" class="tab-inactive px-4 py-2 text-xs font-mono rounded-t-lg">js</button>
                    </div>
                    <textarea id="code-editor" oninput="manualSync()" class="flex-1 bg-transparent text-slate-300 font-mono p-4 text-sm outline-none resize-none" spellcheck="false"></textarea>
                </div>
            </div>

            <footer class="p-4 border-t border-white/5 bg-slate-900/80">
                <div class="max-w-4xl mx-auto relative">
                    <textarea id="user-input" placeholder="Type instructions..." class="w-full bg-white/5 border border-white/10 text-white rounded-xl pl-4 pr-12 py-3 focus:outline-none focus:border-blue-500 h-12 resize-none"></textarea>
                    <button onclick="sendMessage()" id="send-btn" class="absolute right-2 top-1.5 bg-blue-600 text-white w-9 h-9 rounded-lg flex items-center justify-center">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </footer>
        </main>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[10000] p-4">
        <div class="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-sm p-6">
            <h2 class="text-lg font-bold mb-4 text-white">API Config</h2>
            <input type="password" id="setting-key" class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white mb-4 outline-none" placeholder="OpenRouter API Key">
            <div class="flex justify-end gap-3">
                <button onclick="toggleSettings()" class="text-slate-400 px-4 py-2">Cancel</button>
                <button onclick="saveSettings()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Save</button>
            </div>
        </div>
    </div>

    <script>
        let projects = JSON.parse(localStorage.getItem('metai_v5_projects')) || [];
        let currentProjectId = localStorage.getItem('metai_v5_current_id');
        let activeFileTab = 'html';

        function sync() { localStorage.setItem('metai_v5_projects', JSON.stringify(projects)); }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('sidebar-overlay');
            sb.classList.toggle('active');
            ov.classList.toggle('hidden');
        }

        function createNewProject() {
            const id = Date.now().toString();
            const p = { id, name: "New App " + (projects.length + 1), history: [], files: { html: "<h1>Hello World</h1>", css: "", js: "" } };
            projects.unshift(p); sync(); loadProject(id);
        }

        function loadProject(id) {
            currentProjectId = id;
            localStorage.setItem('metai_v5_current_id', id);
            renderProjectList();
            refreshCodeEditor();
            compileAndPreview();
        }

        function renderProjectList() {
            const list = document.getElementById('project-list');
            list.innerHTML = '';
            projects.forEach(p => {
                const isActive = p.id === currentProjectId;
                const div = document.createElement('div');
                div.className = `p-3 rounded-lg cursor-pointer flex justify-between items-center ${isActive ? 'bg-blue-600/20 text-blue-400' : 'text-slate-400'}`;
                div.onclick = () => { loadProject(p.id); if(window.innerWidth < 1024) toggleSidebar(); };
                div.innerHTML = `<span class="truncate">${p.name}</span><i class="fas fa-chevron-right text-[10px]"></i>`;
                list.appendChild(div);
            });
        }

        function setView(v) {
            const isP = v === 'preview';
            document.getElementById('preview-container').classList.toggle('hidden', !isP);
            document.getElementById('code-container').classList.toggle('hidden', isP);
            document.getElementById('btn-preview').className = isP ? "px-4 py-1.5 rounded-md text-[10px] font-bold bg-blue-600 text-white" : "px-4 py-1.5 rounded-md text-[10px] font-bold text-slate-400";
            document.getElementById('btn-code').className = !isP ? "px-4 py-1.5 rounded-md text-[10px] font-bold bg-blue-600 text-white" : "px-4 py-1.5 rounded-md text-[10px] font-bold text-slate-400";
        }

        function switchFile(type) {
            activeFileTab = type;
            ['html', 'css', 'js'].forEach(t => {
                document.getElementById(`tab-${t}`).className = t === type ? 'tab-active px-4 py-2 text-xs font-mono rounded-t-lg' : 'tab-inactive px-4 py-2 text-xs font-mono rounded-t-lg';
            });
            refreshCodeEditor();
        }

        function refreshCodeEditor() {
            const p = projects.find(x => x.id === currentProjectId);
            if(p) document.getElementById('code-editor').value = p.files[activeFileTab];
        }

        function manualSync() {
            const p = projects.find(x => x.id === currentProjectId);
            if(p) { p.files[activeFileTab] = document.getElementById('code-editor').value; sync(); compileAndPreview(); }
        }

        function compileAndPreview() {
            const p = projects.find(x => x.id === currentProjectId);
            if(!p) return;
            const finalCode = `${p.files.html}<style>${p.files.css}</style><script>${p.files.js}<\/script>`;
            const frame = document.getElementById('preview-frame').contentWindow.document;
            frame.open(); frame.write(finalCode); frame.close();
        }

        function toggleSettings() { document.getElementById('settings-modal').classList.toggle('hidden'); document.getElementById('settings-modal').classList.toggle('flex'); }
        function saveSettings() { localStorage.setItem('metai_settings', JSON.stringify({ key: document.getElementById('setting-key').value, model: "deepseek/deepseek-r1:free" })); toggleSettings(); }

        async function sendMessage() {
            const i = document.getElementById('user-input');
            const s = JSON.parse(localStorage.getItem('metai_settings'));
            if(!i.value || !s?.key) return alert("Missing API Key");
            
            const p = projects.find(x => x.id === currentProjectId);
            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.key}`},
                    body: JSON.stringify({ model: s.model, messages: [{role:"system",content:"Return ONLY HTML code using Tailwind."}, ...p.history, {role:"user",content:i.value}] })
                });
                const d = await res.json();
                const code = d.choices[0].message.content.replace(/```html|```/g, '');
                p.files.html = code;
                p.history.push({role:"user",content:i.value}, {role:"assistant",content:code});
                sync(); refreshCodeEditor(); compileAndPreview(); i.value = '';
            } catch(e) { alert("Error"); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(projects.length === 0) createNewProject();
            else loadProject(currentProjectId || projects[0].id);
        });
    </script>
</body>
  </html>
